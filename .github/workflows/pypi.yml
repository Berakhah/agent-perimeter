name: pypi
# Publishes a tagged release to PyPI through trusted publishing (OIDC), so no API token is
# stored anywhere. One-time setup:
#   1. On pypi.org, add a pending trusted publisher for project "agent-perimeter-scan":
#      owner Berakhah, repo agent-perimeter, workflow pypi.yml, environment pypi.
#   2. In this repo, create the "pypi" environment with a required reviewer.
# Each release: [project].version in pyproject.toml must equal the tag without its "v"
# (1.2.1 for v1.2.1). The guard below refuses to publish when they disagree.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v1.2.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Tag and package version must agree
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${TAG}" || { echo "pyproject version ${version} != tag ${TAG}"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
