name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { cache-suffix: test }
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict agent_perimeter
      - run: uv run pytest
      - name: Validate security policy structure
        run: uv run pytest tests/docs/ --no-cov
      - name: Validate SARIF golden against 2.1.0 schema
        run: uv run pytest tests/report/test_sarif.py -v --no-cov
      - name: Upload SARIF sample to code scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: tests/report/golden/basic_scan.sarif.json
      - name: Regenerate the precision/recall table
        run: uv run python -m agent_perimeter.eval.run --write docs/methodology.md
      - name: Fail if the published table is stale
        run: git diff --exit-code docs/methodology.md

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Playwright suite's `pretest` step (web/tests/global-setup.ts,
      # task 16 ruling 1) renders web/tests/fixtures/report.html and
      # census.html by calling `uv run python
      # analysis/render_web_fixtures.py` directly against the Python
      # renderers -- not given in the brief's own web: job sketch, but
      # required for that step to do anything in a fresh runner (the brief's
      # sketch has no Python/uv setup at all).
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { cache-suffix: web }
      - run: uv sync --all-groups
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx tsc --noEmit && npm run lint
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with: { name: playwright-report, path: web/playwright-report/ }
