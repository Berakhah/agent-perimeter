name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict agent_perimeter
      - run: uv run pytest
      - name: Validate SARIF golden against 2.1.0 schema
        run: uv run pytest tests/report/test_sarif.py -v --no-cov
      - name: Upload SARIF sample to code scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tests/report/golden/basic_scan.sarif.json
