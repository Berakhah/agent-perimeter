[project]
name = "agent-perimeter-scan"
version = "1.2.1"
description = "Security posture scanner for MCP servers and tool-using agents, with SARIF output and a drift gate"
readme = "docs/pypi-readme.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bereket Tilahun" }]
keywords = ["mcp", "model-context-protocol", "security", "sarif", "agents", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "jinja2>=3.1",
    "packaging>=24.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/Berakhah/agent-perimeter"
Documentation = "https://github.com/Berakhah/agent-perimeter#readme"
Changelog = "https://github.com/Berakhah/agent-perimeter/blob/main/CHANGELOG.md"
Issues = "https://github.com/Berakhah/agent-perimeter/issues"
Security = "https://github.com/Berakhah/agent-perimeter/security/policy"

[project.scripts]
agent-perimeter = "agent_perimeter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff==0.16.5",
    "types-PyYAML>=6.0",
    "jsonschema>=4.22",
    "hypothesis>=6.167.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution is agent-perimeter-scan; the import package stays agent_perimeter.
packages = ["agent_perimeter"]

[tool.hatch.build.targets.sdist]
# What a source build needs, nothing else: no tests/fixtures (deliberately flawed servers
# and fake credentials), no web/, no census data. Those stay in the git repo.
include = ["/agent_perimeter", "/README.md", "/docs/pypi-readme.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "Starting_Documents", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_perimeter --cov-report=term-missing --cov-fail-under=75"
